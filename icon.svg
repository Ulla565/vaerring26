<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="himmel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6fbde8"/>
      <stop offset="1" stop-color="#d4eefa"/>
    </linearGradient>
  </defs>

  <!-- Natur-bakgrunn -->
  <rect width="512" height="512" fill="url(#himmel)"/>
  <circle cx="410" cy="95" r="38" fill="#fff3b0"/>
  <path d="M0 330 C90 270 170 280 250 320 C330 355 420 300 512 290 L512 512 L0 512 Z" fill="#8bc34a"/>
  <path d="M0 400 C100 340 200 370 290 395 C380 420 450 380 512 360 L512 512 L0 512 Z" fill="#5fa832"/>
  <path d="M0 460 C120 420 220 450 320 462 C400 470 460 450 512 440 L512 512 L0 512 Z" fill="#2e7d32"/>

  <!-- Horn (venstre og speilvendt høyre) -->
  <g id="horn" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M214 242 C120 200 78 300 130 345 C160 372 208 350 192 320 C184 304 160 308 166 324"
