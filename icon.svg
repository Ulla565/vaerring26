    <path d="M214 242 C120 200 78 300 130 345 C160 372 208 350 192 320 C184 304 160 308 166 324"
          stroke="#d8b06a" stroke-width="20"/>
  </g>
  <use href="#horn" transform="translate(512,0) scale(-1,1)"/>

  <!-- Ører -->
  <ellipse cx="190" cy="290" rx="40" ry="16" transform="rotate(-18 190 290)" fill="#333"/>
  <ellipse cx="322" cy="290" rx="40" ry="16" transform="rotate(18 322 290)" fill="#333"/>

