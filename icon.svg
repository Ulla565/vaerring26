    <circle cx="322" cy="365" r="36"/>
  </g>

  <!-- Hode -->
  <ellipse cx="256" cy="300" rx="62" ry="84" fill="#3a3a3a"/>
  <ellipse cx="256" cy="352" rx="38" ry="30" fill="#5c5c5c"/>
  <ellipse cx="243" cy="352" rx="5" ry="8" fill="#1d1d1d"/>
  <ellipse cx="269" cy="352" rx="5" ry="8" fill="#1d1d1d"/>

