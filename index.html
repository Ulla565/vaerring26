<script>
// Versjon av appen. Endres hver gang index.html endres, så det er lett å se om telefonen viser siste utgave.
const APP_VERSJON = "20.11.2026 kl. 19.20";
document.getElementById("versjon").textContent = "Versjon " + APP_VERSJON;

// Medlemmene er hardkodet. id = produsentens kåringsnummer i Sauekontrollen.
const MEDLEMMER = [
    { navn: "Per-Joar",   id: "3411086147", avd: "Søndre" },
    { navn: "Bernt",      id: "3411089273", avd: "Søndre" },
    { navn: "Per Jonas",  id: "3414036784", avd: "Søndre" },
    { navn: "Johanne",    id: "3411074028", avd: "Nordre" },
    { navn: "Einar&Thea", id: "3411010535", avd: "Nordre" },
    { navn: "Agnete",     id: "3411061082", avd: "Nordre" }
];
const AVDELINGER = ["Søndre", "Nordre"];

// Snarvei til insemineringskalkulatoren (eget repo: Ulla565/seminkalkulator på GitHub Pages).
const KALKULATOR_URL = "https://ulla565.github.io/seminkalkulator/";

// De tre beste værene. De bør fordeles så jevnt som mulig mellom Søndre og Nordre.
const STJERNER = ["202613378", "202613405", "202613410"];   // NESTHUN GRIMMEN, GRØNVOLD STYGGEN, GRØNVOLD BOSS
const erStjerne = nr => STJERNER.includes(nr);
const stjerne = nr => erStjerne(nr) ? '<span class="stjerne">★</span> ' : "";

// ---------- Obs-merke (væren trenger hvile) ----------
// Kilde: kolonnen «Obs» i appdata.csv.
//  - Dato (f.eks. 19.11.2026): merket vises til og med dagen før OBS_DAGER dager er gått, og forsvinner så av seg selv.
//  - Tekst (f.eks. «Halt»): merket vises så lenge det står noe i feltet. Tøm feltet for å fjerne merket.
const OBS_DAGER = 2;
const pad2 = n => String(n).padStart(2, "0");

// Dagens dato i Norge, som antall millisekunder ved midnatt (UTC), så datoer kan sammenlignes rett fram
function osloIdag() {
    const [y, m, d] = new Date().toLocaleDateString("sv-SE", { timeZone: "Europe/Oslo" }).split("-").map(Number);
    return Date.UTC(y, m - 1, d);
}

// Tolker innholdet i Obs-feltet. Returnerer null hvis feltet er tomt.
function tolkObs(tekst, idag) {
    const t = rens(tekst);
    if (!t) return null;
    idag = idag ?? osloIdag();

    let y, mo, d, m;
    if ((m = t.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/))) { y = +m[1]; mo = +m[2]; d = +m[3]; }
    else if ((m = t.match(/^(\d{1,2})[./-](\d{1,2})(?:[./-](\d{2}|\d{4}))?\.?$/))) {
        d = +m[1]; mo = +m[2];
        y = m[3] ? (m[3].length === 2 ? 2000 + +m[3] : +m[3]) : new Date(idag).getUTCFullYear();
    }
    const gyldig = y && new Date(Date.UTC(y, mo - 1, d)).getUTCMonth() === mo - 1
                     && new Date(Date.UTC(y, mo - 1, d)).getUTCDate() === d;
    if (!gyldig) return { aktiv: true, tekst: t, dato: null };

    const slutt = Date.UTC(y, mo - 1, d + OBS_DAGER);
    return {
        aktiv: idag < slutt,
        tekst: t,
        dato: `${pad2(d)}.${pad2(mo)}.${y}`,
        til: new Date(slutt - 86400000)   // siste dag merket vises
    };
}

const obsFor = v => v ? tolkObs(v["Obs"]) : null;
const obsAktiv = v => { const o = obsFor(v); return !!(o && o.aktiv); };
const obsMerke = v => obsAktiv(v) ? '<span class="obs">💤 Hvile</span>' : "";
const obsMerkeNr = nr => obsMerke(vaerData.find(x => x["Kåringsnr"] === nr));

let vaerData = [];
let imp = null;      // tolket import.csv, eller null
let advarsler = [];
let visning = null;   // funksjonen som tegner siden brukeren står på, så en oppdatering beholder visningen

function esc(s) {
    return String(s ?? "").replace(/[&<>"']/g, c => (
        { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]
    ));
}

// ---------- CSV ----------
// Håndterer anførselstegn, linjeskift inni celler og komma/semikolon/tab som skilletegn.
function parseCSV(text) {
    text = text.replace(/^\uFEFF/, "");
    const sample = text.slice(0, 3000);
    const delim = [",", ";", "\t"]
        .map(d => [d, sample.split(d).length])
        .sort((a, b) => b[1] - a[1])[0][0];

    const rows = [];
    let row = [], cell = "", q = false;

    for (let i = 0; i < text.length; i++) {
        const c = text[i];
        if (q) {
            if (c === '"') {
                if (text[i + 1] === '"') { cell += '"'; i++; }
                else q = false;
            } else cell += c;
        } else if (c === '"') {
            q = true;
        } else if (c === delim) {
            row.push(cell); cell = "";
        } else if (c === "\n" || c === "\r") {
            if (c === "\r" && text[i + 1] === "\n") i++;
            row.push(cell); rows.push(row);
            row = []; cell = "";
        } else cell += c;
    }
    if (cell !== "" || row.length) { row.push(cell); rows.push(row); }
    return rows.map(r => r.map(c => c.trim()));
}

function tilObjekter(rows) {
    if (!rows.length) return [];
    const headers = rows[0].map(h => h.trim());
    return rows.slice(1)
        .filter(r => r.some(c => c !== ""))
        .map(r => {
            const o = {};
            headers.forEach((h, i) => { o[h] = (r[i] ?? "").trim(); });
            return o;
        });
}

const num = s => parseInt(String(s ?? "").replace(/[\s%]/g, ""), 10) || 0;
const rens = s => String(s ?? "").replace(/\s+/g, " ").trim();

// ---------- Tolking av import.csv (Sauekontrollen-eksport) ----------
function tolkImport(rows) {
    // Overskriftsraden er den som inneholder flest produsent-ID-er
    let hdrIdx = -1, best = 0;
    rows.forEach((r, i) => {
        const treff = MEDLEMMER.filter(m => r.some(c => c.includes(m.id))).length;
        if (treff > best) { best = treff; hdrIdx = i; }
    });
    if (hdrIdx < 0 || best < 3) return null;

    const hdr = rows[hdrIdx];
    const kol = {};
    MEDLEMMER.forEach(m => { kol[m.id] = hdr.findIndex(c => c.includes(m.id)); });
    const nettoKol = hdr.findIndex(c => rens(c).toLowerCase().startsWith("netto paringer"));

    const res = { vaerer: {}, medlem: {} };
    MEDLEMMER.forEach(m => { res.medlem[m.id] = { netto: 0, andre: 0, alle: 0, prove: 0, soyer: 0, mangler: 0 }; });
    res.harAlle = false;

    const settMedlem = (felt, r) => {
        MEDLEMMER.forEach(m => {
            if (kol[m.id] >= 0) res.medlem[m.id][felt] = num(r[kol[m.id]]);
        });
    };

    // Bare værene mellom «Prøvevær» og «Sum Prøvevær» regnes med. Seminelite og andre grupper ignoreres.
    // (Finnes ikke «Prøvevær»-raden, tas alle værer med.)
    let iProve = !rows.some(r => rens(r[0]).toLowerCase() === "prøvevær");

    for (const r of rows.slice(hdrIdx + 1)) {
        const label = rens(r[0]);
        const lower = label.toLowerCase();
        const nr = (label.match(/\d{9,}/) || [])[0];

        if (lower === "prøvevær") { iProve = true; continue; }
        if (lower.startsWith("sum prøvevær")) { iProve = false; settMedlem("prove", r); continue; }

        if (nr) {
            if (!iProve) continue;
            const per = {};
            let sum = 0;
            MEDLEMMER.forEach(m => {
                const v = kol[m.id] >= 0 ? num(r[kol[m.id]]) : 0;
                per[m.id] = v; sum += v;
            });
            res.vaerer[nr] = {
                navn: label.replace(nr, "").trim(),
                netto: nettoKol >= 0 ? num(r[nettoKol]) : sum,
                perProdusent: per
            };
        } else if (lower.startsWith("netto paringer")) settMedlem("netto", r);
        else if (lower.startsWith("sum andre")) settMedlem("andre", r);
        else if (lower.startsWith("sum alle")) { settMedlem("alle", r); res.harAlle = true; }
        else if (lower.startsWith("antall avlss")) settMedlem("soyer", r);
        else if (lower.startsWith("mangler paring")) settMedlem("mangler", r);
    }
    return res;
}

// ---------- Klargjøring og kontroll av appdata.csv ----------
const nn = s => String(s ?? "").toLowerCase().replace(/[\s\-]+/g, "");

// Retter små skrivemåter i «Hos» (Per Joar → Per-Joar) og returnerer advarsler.
function klargjorVaerData(rader) {
    const adv = [];
    const mangler = ["Kåringsnr", "Vær", "Hos"].filter(k => rader.length && !(k in rader[0]));
    if (mangler.length) adv.push(`appdata.csv mangler kolonnen: ${mangler.map(k => "«" + k + "»").join(", ")}.`);

    const ukjent = [], sett = new Set(), dubletter = [];
    for (const v of rader) {
        const m = MEDLEMMER.find(m => nn(m.navn) === nn(v["Hos"]));
        if (m) v["Hos"] = m.navn;
        else ukjent.push(`${v["Vær"] || v["Kåringsnr"]} («${v["Hos"] || "tom"}»)`);

        if (sett.has(v["Kåringsnr"])) dubletter.push(v["Kåringsnr"]);
        sett.add(v["Kåringsnr"]);
    }
    if (ukjent.length) adv.push(`Ukjent «Hos» i appdata.csv: ${ukjent.join(", ")}. Gyldige navn: ${MEDLEMMER.map(m => m.navn).join(", ")}.`);
    if (dubletter.length) adv.push(`Kåringsnummer som står flere ganger i appdata.csv: ${dubletter.join(", ")}.`);
    return adv;
}

// Værene i appdata.csv og import.csv skal være de samme.
function sjekkMotImport() {
    const adv = [];
    const iApp = new Set(vaerData.map(v => v["Kåringsnr"]));
    const utenImport = vaerData.filter(v => !imp.vaerer[v["Kåringsnr"]]).map(v => `${v["Vær"]} (${v["Kåringsnr"]})`);
    const utenApp = Object.entries(imp.vaerer).filter(([nr]) => !iApp.has(nr)).map(([nr, v]) => `${v.navn} (${nr})`);
    if (utenImport.length) adv.push(`Finnes i appdata.csv, men ikke i import.csv: ${utenImport.join(", ")}.`);
    if (utenApp.length) adv.push(`Finnes i import.csv, men ikke i appdata.csv: ${utenApp.join(", ")}.`);
    return adv;
}

// ---------- Kvote og «ferdig» ----------
// Hver vær skal brukes like mye i hver besetning i forhold til antall avlssøyer:
// kvote = (avlssøyer minus søyer paret med værer utenfor prøveværene) / antall prøvevær, avrundet
// (48 søyer / 16 værer = 3 parringer). Kvoten er et veiledende tak, ikke en hard grense.
// «Utenfor prøveværene» er alt som ikke er prøvevær: andre værer, seminelite, granska vær osv.
// Det regnes ut som «Sum alle værer» minus «Sum Prøvevær».
// En vær er «ferdig» hos et medlem når antall parringer har nådd kvoten.
function utenforProve(x) {
    return imp.harAlle ? Math.max(0, x.alle - x.prove) : x.andre;
}
function kvote(m) {
    const n = Object.keys(imp.vaerer).length || 1;
    const x = imp.medlem[m.id];
    return Math.round(Math.max(0, x.soyer - utenforProve(x)) / n);
}
const utfort = (m, nr) => imp.vaerer[nr] ? imp.vaerer[nr].perProdusent[m.id] : 0;
const igjenHos = (m, nr) => Math.max(0, kvote(m) - utfort(m, nr));
const erFerdig = (m, nr) => igjenHos(m, nr) === 0;
const holder = v => MEDLEMMER.find(m => m.navn === v["Hos"]);

// ---------- Visning ----------
function visForside() {
    visning = visForside;
    const antall = avd => MEDLEMMER
        .filter(m => m.avd === avd)
        .reduce((s, m) => s + vaerData.filter(v => v["Hos"] === m.navn).length, 0);
    const hviler = avd => MEDLEMMER
        .filter(m => m.avd === avd)
        .reduce((s, m) => s + vaerData.filter(v => v["Hos"] === m.navn && obsAktiv(v)).length, 0);

    document.getElementById("app").innerHTML = `

function visAvdeling(avd) {
    visning = () => visAvdeling(avd);
    let html = `<div class="tilbake" onclick="visForside()">← Tilbake</div>`;

    MEDLEMMER.filter(m => m.avd === avd).forEach(m => {

        html += `

        vaerData.filter(v => v["Hos"] === m.navn).forEach(v => {

function visVaer(karingsnr, avd) {
    visning = () => visVaer(karingsnr, avd);
    const vaer = vaerData.find(v => v["Kåringsnr"] === karingsnr);
    if (!vaer) { visForside(); return; }
    const info = imp ? imp.vaerer[karingsnr] : null;

    const rader = info
        ? MEDLEMMER.map(m => {
            const n = info.perProdusent[m.id], k = kvote(m);

            return `<tr><td>${esc(m.navn)}${her}</td>

            o.dato ? `Obs satt ${esc(o.dato)}. Merket forsvinner etter ${esc(o.til.toLocaleDateString("nb-NO", { day: "numeric", month: "long", timeZone: "UTC" }))}.`

// Totaloversikt: de 16 prøveværene, sortert med flest paringer øverst.
function visTotal() {
    visning = visTotal;
    const MAL = 25;

    const rader = Object.entries(imp.vaerer).map(([nr, v]) => {
        const a = vaerData.find(x => x["Kåringsnr"] === nr);
        return {
            nr,
            navn: a ? a["Vær"] : v.navn,
            hos: a ? a["Hos"] : "",
            netto: v.netto,
            kjent: !!a
        };
    }).sort((x, y) => y.netto - x.netto || x.navn.localeCompare(y.navn, "no"));

    const total = rader.reduce((s, r) => s + r.netto, 0);
    const igjen = rader.reduce((s, r) => s + Math.max(0, MAL - r.netto), 0);
    const nadd = rader.filter(r => r.netto >= MAL).length;
    const maks = Math.max(MAL, ...rader.map(r => r.netto));
    const malPos = MAL / maks * 100;

    document.getElementById("app").innerHTML = `
    <div class="tilbake" onclick="visForside()">← Tilbake</div>
    <h2>Totaloversikt prøvevær</h2>
    <div class="tall">
        <div><b>${total}</b>paringer totalt</div>
        <div><b>${nadd} / ${rader.length}</b>har nådd ${MAL}</div>
        <div><b>${igjen}</b>gjenstår til mål</div>
    </div>
    ${rader.map(r => `
    <div class="sr" ${r.kjent ? `onclick="visVaer('${esc(r.nr)}', 'total')"` : ""}>
        <div class="sl">
            <span>${stjerne(r.nr)}${esc(r.navn)} ${r.hos ? `<small>${esc(r.hos)}</small>` : ""}${obsMerkeNr(r.nr)}</span>
            <b>${r.netto} / ${MAL}</b>
        </div>
        <div class="spor">
            <div class="fyll" style="width:${r.netto / maks * 100}%;background:${r.netto >= MAL ? "#2e9e4f" : "#3b82f6"}"></div>
            <div class="mal" style="left:${malPos}%"></div>
        </div>
    </div>`).join("")}`;
}

const harBeskjeder = () => !!BESKJED_URL;

    day: "numeric", month: "short", hour: "2-digit", minute: "2-digit", timeZone: "Europe/Oslo"
});

async function lastBeskjeder() {
    if (!harBeskjeder()) return;
    try {
        const r = await fetch(BESKJED_URL + "?t=" + Date.now());
        const d = await r.json();
        if (d.ok) {
            beskjeder = d.beskjeder;
            oppdaterForinger();
            oppdaterLaaste();
            oppdaterInnst();
            tegnLapper();

                const y = window.scrollY; visLogistikk(); window.scrollTo(0, y);

}

}

async function sendBeskjed(data) {

        const r = await fetch(BESKJED_URL, { method: "POST", body: JSON.stringify(data) });
        return await r.json();
    } catch (e) {
        return { ok: false, feil: "Fikk ikke kontakt. Sjekk nettet og prøv igjen." };

    if (sender) return;
    const navn = document.getElementById("bNavn").value;
    const kode = document.getElementById("bKode").value;

    const feil = document.getElementById("bFeil");

        await lastBeskjeder();

}

}

// ---------- Logistikk ----------
// Antakelse: «Hos» i appdata.csv er hvor væren står nå. Flytter du en vær, endrer du «Hos».
//
// Forutsetninger (settes øverst på Logistikk-siden og huskes på denne enheten) overstyrer beregningen:
//    - Prioriterte ønsker / faste føringer (inntil MAKS_FORINGER): «denne væren skal fra A til B ved neste flytting».
//    - Per medlem: «sende fra seg» x værer (også værer som ikke er ferdige), og/eller «skal ende med» x værer.
//    - Antall værer hver vei i hovedbyttet, valgt hver for seg (f.eks. 4 sørover og 6 nordover).
// Rekkefølgen i beregningen:
//    0) Faste føringer.
//    A) Medlemmer som skal sende fra seg værer (eller har flere enn de skal ende med): de værene som har minst
//       igjen hos medlemmet flyttes, helst innad i avdelingen.
//    1) Innad i hver avdeling: en vær som er ferdig hos den som har den, flyttes til et medlem i samme avdeling
//       som har mer igjen av kvoten. De som har flest søyer igjen å pare per vær de har, får flest.
//    2) Bytte mellom Nordre og Søndre: foreslås når minst BYTTE_VAERER værer er ferdige hos minst
//       BYTTE_MEDLEMMER medlemmer (eller når du ber om det). Flyttinger mellom avdelingene fra trinnene over
//       teller med i antallet. Stjerneværene holdes jevnt fordelt.
//    B) Medlemmer som fortsatt har færre enn de skal ende med, får værer fra andre (helst i samme avdeling,
//       helst værer som er ferdige der de står). Ingen tas under sitt eget mål, og ingen uten mål tømmes helt.
// Et medlem med «skal ende med» tar ikke imot flere værer enn målet.
// Værer med aktivt hvile-merke (Obs i appdata.csv) flyttes ikke, med mindre de står i en fast føring.
// De telles likevel med i antallet værer hvert medlem har.
// Til slutt kontrolleres det om forutsetningene faktisk ble oppfylt.
// Forslaget kan låses som en gul huskelapp nederst på Logistikk-siden (felles for alle, lagres i Google-regnearket).
const ANTALL_BYTTE = 4;        // standard antall værer hver vei i et bytte
const MAKS_BYTTE = 8;          // høyeste antall som kan velges per retning
const MAKS_FORINGER = 6;       // antall faste føringer
const MAKS_MAL = 12;           // høyeste «skal ende med» som kan velges
const BYTTE_MEDLEMMER = 4;     // «ferdig hos de fleste medlemmene»: minst 4 av 6
const BYTTE_VAERER = 4;        // «flere av værene»: minst 4 værer
const FAA_PARRINGER = 3;       // en vær med så mange eller færre parringer der den står, flyttes bare når det trengs

function lesLager(nokkel, std) {
    try { const v = localStorage.getItem(nokkel); return v === null ? std : JSON.parse(v); } catch (e) { return std; }
}
function skrivLager(nokkel, v) { try { localStorage.setItem(nokkel, JSON.stringify(v)); } catch (e) {} }

// ---------- Felles innstillinger ----------
// «Sende fra seg», «Ende med» og antall i hovedbyttet er felles for alle. De lagres som én beskjed i
// Google-regnearket (samme skript som de gule lappene), og den nyeste gjelder:
//   «INNST|<Nordre→Søndre>|<Søndre→Nordre>|<medlem>:<sende fra seg>:<ende med>,...»
//   a = automatisk, medlem = plassen i MEDLEMMER, tomt felt = ikke satt.
// Endringer gjøres først som et utkast på denne enheten, og blir felles når de lagres med navn og kode.
// tilSor = Nordre → Søndre, tilNord = Søndre → Nordre. «auto» = appen regner ut antallet selv (se lagForslag).
const AUTO = "auto";
const autoBytte = () => ({ tilSor: AUTO, tilNord: AUTO });
const tomtKrav = () => Object.fromEntries(MEDLEMMER.map(m => [m.navn, { gi: null, mal: null }]));
const tomInnst = () => ({ bytte: autoBytte(), krav: tomtKrav() });
const INNST_PREFIKS = "INNST|";
const erInnst = b => String(b.tekst || "").startsWith(INNST_PREFIKS);
const kopi = o => JSON.parse(JSON.stringify(o));

function pakkInnst(i) {
    const tall = v => v === AUTO ? "a" : String(v);
    const krav = MEDLEMMER.map((m, idx) => {
        const k = i.krav[m.navn];
        return k.gi === null && k.mal === null ? "" : `${idx}:${k.gi ?? ""}:${k.mal ?? ""}`;
    }).filter(Boolean).join(",");
    return `${INNST_PREFIKS}${tall(i.bytte.tilSor)}|${tall(i.bytte.tilNord)}|${krav}`;
}
function pakkUtInnst(tekst) {
    const i = tomInnst();
    const [, s, n, krav = ""] = String(tekst).split("|");
    const tall = v => { if (v === "a") return AUTO; const x = parseInt(v, 10); return x >= 0 && x <= MAKS_BYTTE ? x : AUTO; };
    i.bytte.tilSor = tall(s); i.bytte.tilNord = tall(n);
    krav.split(",").filter(Boolean).forEach(e => {
        const [idx, gi, mal] = e.split(":");
        const m = MEDLEMMER[+idx];
        if (!m) return;
        if (/^\d+$/.test(gi || "") && +gi > 0) i.krav[m.navn].gi = +gi;
        if (/^\d+$/.test(mal || "")) i.krav[m.navn].mal = +mal;
    });
    return i;
}

let felles = tomInnst();      // de lagrede, felles innstillingene
let fellesInfo = null;        // { id, navn, tid } for den lagrede beskjeden
let fellesIder = [];          // alle INNST-beskjeder (eldre ryddes bort ved lagring)
let utkast = null;            // ulagrede endringer på denne enheten, eller null
let byttAntall, medlemKrav;   // det som brukes i beregningen: utkastet hvis det finnes, ellers det felles
function brukInnst() { const k = utkast || felles; byttAntall = k.bytte; medlemKrav = k.krav; }
brukInnst();

function oppdaterInnst() {
    const liste = beskjeder.filter(erInnst).sort((a, b) => (new Date(b.tid) - new Date(a.tid)) || 0);
    fellesIder = liste.map(b => b.id);
    felles = liste.length ? pakkUtInnst(liste[0].tekst) : tomInnst();
    fellesInfo = liste.length ? { id: liste[0].id, navn: liste[0].navn, tid: liste[0].tid } : null;
    if (utkast && pakkInnst(utkast) === pakkInnst(felles)) utkast = null;
    brukInnst();
}
const harUtkast = () => !!utkast && pakkInnst(utkast) !== pakkInnst(felles);
function endreUtkast(endring) {
    if (!utkast) utkast = kopi(felles);
    endring(utkast);
    if (!harUtkast()) utkast = null;
    brukInnst();
    visLogistikk();
}
function forkastUtkast() { utkast = null; brukInnst(); visLogistikk(); }

let lagrerInnst = false;
async function lagreInnst() {
    if (lagrerInnst || !utkast) return;
    const navn = document.getElementById("iNavn").value, kode = document.getElementById("iKode").value;
    const feil = document.getElementById("iFeil"), knapp = document.getElementById("iSend");
    if (!navn) { feil.textContent = "Velg navnet ditt."; return; }
    if (kode.length < 4) { feil.textContent = "Skriv inn koden."; return; }

    lagrerInnst = true; feil.textContent = ""; knapp.textContent = "Lagrer...";
    const gamle = fellesIder.slice();
    const d = await sendBeskjed({ handling: "ny", navn, kode, tekst: pakkInnst(utkast) });
    if (d.ok) {
        // Rydd bort eldre innstillinger. Lykkes ikke det, gjelder likevel den nyeste.
        for (const id of gamle) await sendBeskjed({ handling: "slett", id, kode });
        try { localStorage.setItem("vaerring_navn", navn); } catch (e) {}
        felles = kopi(utkast); utkast = null; brukInnst();
        lagrerInnst = false;
        visLogistikk();
        await lastBeskjeder();
    } else {
        lagrerInnst = false;
        feil.textContent = d.feil || "Noe gikk galt.";
        knapp.textContent = "Lagre for alle";
    }
}

const harManueltBytte = () => byttAntall.tilSor !== AUTO || byttAntall.tilNord !== AUTO;

// Faste føringer er felles for alle. De lagres som beskjeder i Google-regnearket (samme skript som de gule lappene)
// med teksten «FØRING|kåringsnr|fra|til», og vises ikke som gule lapper.
// foringer = [{ id, nr, fra, til, navn, tid }], eldste først (ved to føringer på samme vær gjelder den eldste).
const FORING_PREFIKS = "FØRING|";
const erForing = b => String(b.tekst || "").startsWith(FORING_PREFIKS);
let foringer = [];
function oppdaterForinger() {
    foringer = beskjeder.filter(erForing).map(b => {
        const [, nr, fra, til] = String(b.tekst).split("|");
        return { id: b.id, nr: nr || "", fra: fra || "", til: til || "", navn: b.navn, tid: b.tid };
    }).sort((a, b) => (new Date(a.tid) - new Date(b.tid)) || 0);
}

// Krav per medlem (medlemKrav): { navn: { gi, mal } }, null = ikke satt. Se «Felles innstillinger».
const harKrav = () => MEDLEMMER.some(m => medlemKrav[m.navn].gi !== null || medlemKrav[m.navn].mal !== null);

let visByttLikevel = false;
let sisteForslag = null;
// Er boksen «Antall værer per medlem» åpen? Lukket som standard.
let visKrav = false;

function settBytt(retning, n) { endreUtkast(u => { u.bytte[retning] = n === AUTO ? AUTO : +n; }); }
function settByttLikevel(v) { visByttLikevel = v; visLogistikk(); }

function settKrav(navn, felt, verdi) {
    if (!medlemKrav[navn]) return;
    endreUtkast(u => { u.krav[navn][felt] = verdi === "" ? null : +verdi; });
}

// Skjema for ny fast føring (navn og kode som for beskjeder)
const vaerValgHtml = () => `<option value="">Velg vær</option>` + vaerData
    .filter(v => imp.vaerer[v["Kåringsnr"]])
    .slice().sort((a, b) => a["Vær"].localeCompare(b["Vær"], "no"))
    .map(v => `<option value="${esc(v["Kåringsnr"])}">${erStjerne(v["Kåringsnr"]) ? "★ " : ""}${esc(v["Vær"])}${obsAktiv(v) ? " (hviler)" : ""}</option>`).join("");
const medlemValgHtml = (valgt, tom) => `<option value="">${tom}</option>` + AVDELINGER.map(a =>
    `<optgroup label="${a}">${MEDLEMMER.filter(m => m.avd === a).map(m =>
        `<option value="${esc(m.navn)}"${m.navn === valgt ? " selected" : ""}>${esc(m.navn)}</option>`).join("")}</optgroup>`).join("");
const foringKnapp = () => foringer.length < MAKS_FORINGER
    ? `<div class="liten" onclick="apneForingSkjema()">+ Nytt prioritert ønske for neste flytting (${foringer.length} / ${MAKS_FORINGER})</div>`
    : `<p class="notat">Det kan være ${MAKS_FORINGER} prioriterte ønsker samtidig. Slett et for å legge inn et nytt.</p>`;

function apneForingSkjema() {

    try { sist = localStorage.getItem("vaerring_navn") || ""; } catch (e) {}
    document.getElementById("nyForing").innerHTML = `

        <div class="fratil">

            <span class="pil">→</span>
            <select id="fTil" aria-label="Til">${medlemValgHtml("", "Til")}</select>
        </div>
        <label for="fNavn">Lagt inn av</label>
        <select id="fNavn">${medlemValgHtml(sist, "Velg navn")}</select>
        <label for="fKode">Kode</label>
        <input id="fKode" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="4" autocomplete="off">
        <div class="skjemafeil" id="fFeil"></div>
        <div class="rad">
            <div class="liten ok" id="fSend" onclick="sendForing()">Legg inn ønsket</div>
            <div class="liten" onclick="lukkForingSkjema()">Avbryt</div>
        </div>
    </div>`;
}
function lukkForingSkjema() {
    const el = document.getElementById("nyForing");
    if (el) el.innerHTML = foringKnapp();
}
function velgForingVaer(nr) {   // «fra» settes til der væren står nå
    const v = vaerData.find(x => x["Kåringsnr"] === nr);
    document.getElementById("fFra").value = v ? v["Hos"] : "";
}

let senderForing = false;
async function sendForing() {
    if (senderForing) return;
    const verdi = id => document.getElementById(id).value;
    const nr = verdi("fNr"), fra = verdi("fFra"), til = verdi("fTil"), navn = verdi("fNavn"), kode = verdi("fKode");
    const feil = document.getElementById("fFeil"), knapp = document.getElementById("fSend");
    if (!nr) { feil.textContent = "Velg en vær."; return; }
    if (!fra || !til) { feil.textContent = "Velg hvem væren skal fra og til."; return; }
    if (fra === til) { feil.textContent = "Fra og til kan ikke være samme medlem."; return; }
    if (foringer.some(f => f.nr === nr)) { feil.textContent = "Denne væren har allerede et prioritert ønske. Slett det først."; return; }
    if (!navn) { feil.textContent = "Velg navnet ditt."; return; }
    if (kode.length < 4) { feil.textContent = "Skriv inn koden."; return; }

    senderForing = true; feil.textContent = ""; knapp.textContent = "Sender...";
    const d = await sendBeskjed({ handling: "ny", navn, kode, tekst: [FORING_PREFIKS.slice(0, -1), nr, fra, til].join("|") });
    senderForing = false;
    if (d.ok) {
        try { localStorage.setItem("vaerring_navn", navn); } catch (e) {}
        lukkForingSkjema();
        await lastBeskjeder();
    } else {
        feil.textContent = d.feil || "Noe gikk galt.";
        knapp.textContent = "Legg inn ønsket";
    }
}

async function slettForing(id) {
    const kode = prompt("Skriv koden for å slette dette prioriterte ønsket:");
    if (!kode) return;
    const d = await sendBeskjed({ handling: "slett", id, kode });
    if (d.ok) await lastBeskjeder();
    else alert(d.feil || "Kunne ikke slette.");
}

function nullstillForutsetninger() {
    if (!confirm("Fjerne alle krav per medlem og sette antall i byttet tilbake til automatisk? Prioriterte ønsker påvirkes ikke. Endringen gjelder for alle når du har lagret den.")) return;
    endreUtkast(u => { u.bytte = autoBytte(); u.krav = tomtKrav(); });
}

const behov = m => imp.medlem[m.id].mangler;   // søyer som ennå ikke er paret
const aktiveHos = m => vaerData.filter(v => imp.vaerer[v["Kåringsnr"]] &&
    v["Hos"] === m.navn && !erFerdig(m, v["Kåringsnr"])).length;
const restI = (avd, nr) => MEDLEMMER.filter(m => m.avd === avd)
    .reduce((sum, m) => sum + igjenHos(m, nr), 0);
const andreAvd = avd => avd === "Søndre" ? "Nordre" : "Søndre";
const medlemNavn = navn => MEDLEMMER.find(m => m.navn === navn);

function byttStatus() {
    const nrs = Object.keys(imp.vaerer);
    const ferdige = nrs.filter(nr => MEDLEMMER.filter(m => erFerdig(m, nr)).length >= BYTTE_MEDLEMMER).length;
    return { ferdige, totalt: nrs.length, trengs: ferdige >= BYTTE_VAERER };
}

function kombinasjoner(liste, k) {
    const ut = [];
    (function gaa(start, valgt) {
        if (valgt.length === k) { ut.push(valgt.slice()); return; }
        for (let i = start; i < liste.length; i++) { valgt.push(liste[i]); gaa(i + 1, valgt); valgt.pop(); }
    })(0, []);
    return ut;
}

// Er nøkkel a bedre enn b? Ledd for ledd, første forskjell avgjør.
function bedre(a, b) {
    for (let i = 0; i < a.length; i++) if (a[i] !== b[i]) return a[i] > b[i];
    return false;
}

function lagForslag(medBytte) {
    const vaerer = vaerData
        .filter(v => imp.vaerer[v["Kåringsnr"]] && holder(v))
        .map(v => ({ nr: v["Kåringsnr"], navn: v["Vær"], fra: holder(v) }));

    const res = {
        faste: [], foringsfeil: [], utforte: 0, maaGi: [], ekstra: [],
        intern: { "Søndre": [], "Nordre": [] },
        bytte: { tilSor: [], tilNord: [], onsketSor: 0, onsketNord: 0, auto: null },
        stjerner: null, ferdigOveralt: [], utenForslag: 0, hviler: [],
        har: {}, etter: {}, kontroll: []
    };
    const flyttet = new Set();

    // 0a) Kontroller de faste føringene. «Fra» i en føring overstyrer hvor væren står.
    const gyldige = [], brukt = new Set();
    foringer.forEach((f, i) => {
        if (!f.nr || !f.til) return;   // ikke ferdig utfylt ennå
        const v = vaerer.find(x => x.nr === f.nr);
        const fra = medlemNavn(f.fra) || (v && v.fra);
        const til = medlemNavn(f.til);
        if (!v) { res.foringsfeil.push(`Ønske ${i + 1}: Fant ikke væren ${f.nr}.`); return; }
        if (til && v.fra.id === til.id) { res.utforte++; return; }   // står allerede der den skal (utført)
        if (brukt.has(v.nr)) { res.foringsfeil.push(`Ønske ${i + 1}: ${v.navn} har et prioritert ønske fra før. Bare det første brukes.`); return; }
        if (!til || !fra) { res.foringsfeil.push(`Ønske ${i + 1}: Ukjent medlem.`); return; }
        if (fra.id === til.id) { res.foringsfeil.push(`Ønske ${i + 1}: ${v.navn} har samme medlem som fra og til.`); return; }
        v.fra = fra;
        brukt.add(v.nr);
        gyldige.push({ v, til });
    });

    // Antall værer per medlem nå (hvilende værer telles med), og hvor mange de får inn og gir fra seg
    const har = {}, inn = {}, ut = {}, aktive = {};
    MEDLEMMER.forEach(m => {
        har[m.id] = vaerer.filter(v => v.fra.id === m.id).length;
        inn[m.id] = 0; ut[m.id] = 0; aktive[m.id] = aktiveHos(m);
    });
    const antallEtter = m => har[m.id] - ut[m.id] + inn[m.id];
    const mal = m => medlemKrav[m.navn].mal;
    const underMal = m => mal(m) === null ? 0 : Math.max(0, mal(m) - antallEtter(m));
    const kanTa = m => mal(m) === null || antallEtter(m) < mal(m);
    const poeng = m => behov(m) / (aktive[m.id] + inn[m.id] + 1);
    const mottaker = (liste, v) => {
        const mulige = liste.filter(m => m.id !== v.fra.id && kanTa(m));
        const sorter = (a, b) => underMal(b) - underMal(a) || poeng(b) - poeng(a) || igjenHos(b, v.nr) - igjenHos(a, v.nr);
        // Helst en som har noe igjen å pare med væren; ellers den som trenger flest værer
        return mulige.filter(m => igjenHos(m, v.nr) > 0).sort(sorter)[0] || mulige.sort(sorter)[0];
    };
    const flytt = (v, til, liste, merke) => {
        inn[til.id]++; ut[v.fra.id]++; flyttet.add(v.nr);
        liste.push({ ...v, til, merke });
    };

    // 0b) Faste føringer
    gyldige.forEach(({ v, til }) => flytt(v, til, res.faste, "Prioritert"));

    // Værer med hvile-merke foreslås ikke flyttet
    const hviler = new Set(vaerer.filter(v => !flyttet.has(v.nr) &&
        obsAktiv(vaerData.find(x => x["Kåringsnr"] === v.nr))).map(v => v.nr));
    res.hviler = vaerer.filter(v => hviler.has(v.nr));
    const ledig = v => !flyttet.has(v.nr) && !hviler.has(v.nr);

    // A) Medlemmer som skal sende fra seg værer (krav «sende fra seg», eller flere enn «skal ende med»)
    const maaGiAntall = m => {
        const k = medlemKrav[m.navn];
        return Math.max(k.gi || 0, k.mal !== null ? har[m.id] - k.mal : 0);
    };
    for (const m of MEDLEMMER) {
        let trengs = maaGiAntall(m) - ut[m.id];
        if (trengs <= 0) continue;
        const kandidater = vaerer.filter(v => v.fra.id === m.id && ledig(v))
            .sort((a, b) => igjenHos(m, a.nr) - igjenHos(m, b.nr));   // minst igjen hos m først
        for (const v of kandidater) {
            if (trengs <= 0) break;
            const til = mottaker(MEDLEMMER.filter(x => x.avd === m.avd), v)
                     || mottaker(MEDLEMMER.filter(x => x.avd !== m.avd), v);
            if (!til) break;
            flytt(v, til, res.maaGi);
            trengs--;
        }
    }

    // Værer med FAA_PARRINGER eller færre parringer der de står, foreslås ikke flyttet bare fordi de er ferdige.
    // De kan likevel flyttes når det trengs: prioriterte ønsker, «sende fra seg», «ende med» og bytte med
    // antall satt for hånd (der velges de sist). Automatisk bytte tar dem ikke med.
    const faa = v => utfort(v.fra, v.nr) <= FAA_PARRINGER;

    // 1) Innad i avdelingene
    for (const v of vaerer) {
        if (!ledig(v) || !erFerdig(v.fra, v.nr) || faa(v)) continue;
        const til = mottaker(MEDLEMMER.filter(m => m.avd === v.fra.avd), v);
        if (til) flytt(v, til, res.intern[v.fra.avd]);
    }

    // Stjerner per avdeling: [Nordre, Søndre], før og etter alle flyttinger
    const stjerneI = avd => vaerer.filter(v => erStjerne(v.nr) && v.fra.avd === avd).length;
    const foer = [stjerneI("Nordre"), stjerneI("Søndre")];
    const flyttStjerner = (fra, liste) => {
        const s = fra.slice();
        liste.filter(x => erStjerne(x.nr) && x.fra.avd !== x.til.avd).forEach(x => {
            if (x.til.avd === "Nordre") { s[0]++; s[1]--; } else { s[0]--; s[1]++; }
        });
        return s;
    };
    const alleFlytt = () => [...res.faste, ...res.maaGi, ...res.intern["Søndre"], ...res.intern["Nordre"],
        ...res.bytte.tilSor, ...res.bytte.tilNord, ...res.ekstra];
    const kryss = (fraAvd, tilAvd) => alleFlytt().filter(x => x.fra.avd === fraAvd && x.til.avd === tilAvd).length;

    // 2) Bytte mellom Nordre og Søndre
    const b = res.bytte;

    // Automatisk antall: værene fordeles mellom avdelingene i forhold til hvor mange søyer som er igjen å pare
    // («Mangler paring»). Hvilende værer telles med. Utgangspunktet er ANTALL_BYTTE hver vei, og den avdelingen
    // som har for få værer, får i tillegg det den mangler. Er bare én retning satt for hånd, justeres den andre
    // så forskjellen blir riktig.
    {
        const sumI = (avd, fn) => MEDLEMMER.filter(m => m.avd === avd).reduce((s, m) => s + fn(m), 0);
        // Antall i Nordre før noen flytting mellom avdelingene
        const forN = sumI("Nordre", antallEtter) - kryss("Søndre", "Nordre") + kryss("Nordre", "Søndre");
        const totalt = sumI("Nordre", antallEtter) + sumI("Søndre", antallEtter);
        const bN = sumI("Nordre", behov), bS = sumI("Søndre", behov);
        const malNord = bN + bS > 0 ? Math.round(totalt * bN / (bN + bS)) : forN;
        const diff = malNord - forN;   // > 0: Nordre trenger flere, < 0: Søndre trenger flere
        const s = byttAntall.tilSor, n = byttAntall.tilNord;
        let tilSor, tilNord;
        if (s === AUTO && n === AUTO) { tilSor = ANTALL_BYTTE + Math.max(0, -diff); tilNord = ANTALL_BYTTE + Math.max(0, diff); }
        else if (s === AUTO) { tilNord = n; tilSor = Math.max(0, n - diff); }
        else if (n === AUTO) { tilSor = s; tilNord = Math.max(0, s + diff); }
        else { tilSor = s; tilNord = n; }
        b.onsketSor = Math.min(tilSor, 10); b.onsketNord = Math.min(tilNord, 10);
        b.auto = { malNord, malSor: totalt - malNord, forN, forS: totalt - forN, totalt, diff };
    }

    if (medBytte) {
        const kandidater = avd => vaerer
            .filter(v => v.fra.avd === avd && ledig(v))
            .map(v => ({ ...v, poeng: restI(andreAvd(avd), v.nr) - restI(avd, v.nr), annet: restI(andreAvd(avd), v.nr) }))
            .filter(v => v.annet > 0)   // må ha noe igjen å gjøre i den andre avdelingen
            // Værer med få parringer tas bare med når antallet i den retningen er satt for hånd
            .filter(v => !faa(v) || byttAntall[avd === "Nordre" ? "tilSor" : "tilNord"] !== AUTO)
            .sort((a, b) => Number(faa(a)) - Number(faa(b)) || b.poeng - a.poeng)   // værer med få parringer sist
            .slice(0, 10);

        const nord = kandidater("Nordre"), sor = kandidater("Søndre");

        // Automatisk retning: tilpass etter hvor mange som faktisk kan sendes den andre veien,
        // så avdelingene ender med riktig fordeling selv om én retning mangler værer.
        const muligSor = kryss("Nordre", "Søndre") + Math.min(Math.max(0, b.onsketSor - kryss("Nordre", "Søndre")), nord.length);
        const muligNord = kryss("Søndre", "Nordre") + Math.min(Math.max(0, b.onsketNord - kryss("Søndre", "Nordre")), sor.length);
        if (byttAntall.tilNord === AUTO) b.onsketNord = Math.min(b.onsketNord, Math.max(0, muligSor + b.auto.diff));
        if (byttAntall.tilSor === AUTO) b.onsketSor = Math.min(b.onsketSor, Math.max(0, muligNord - b.auto.diff));
        const kSor = Math.min(Math.max(0, b.onsketSor - kryss("Nordre", "Søndre")), nord.length);    // Nordre → Søndre
        const kNord = Math.min(Math.max(0, b.onsketNord - kryss("Søndre", "Nordre")), sor.length);  // Søndre → Nordre

        if (kSor + kNord > 0) {
            const [baseN, baseS] = flyttStjerner(foer, alleFlytt());
            let beste = null;
            for (const n of kombinasjoner(nord, kSor)) {
                const sn = n.filter(v => erStjerne(v.nr)).length;
                const sumN = n.reduce((t, v) => t + v.poeng, 0);
                for (const so of kombinasjoner(sor, kNord)) {
                    const ss = so.filter(v => erStjerne(v.nr)).length;
                    const lave = n.filter(faa).length + so.filter(faa).length;
                    const nNord = baseN - sn + ss, nSor = baseS - ss + sn;
                    const straff = Math.max(0, Math.abs(nNord - nSor) - 1);
                    const sum = sumN + so.reduce((t, v) => t + v.poeng, 0);
                    // Rekkefølge: stjerner jevnt fordelt, færrest værer med få parringer der de står,
                    // flest parringer igjen i den andre avdelingen, færrest stjerner flyttet.
                    const nokkel = [-straff, -lave, sum, -(sn + ss)];
                    if (!beste || bedre(nokkel, beste.nokkel)) beste = { n, so, nokkel };
                }
            }
            const tildel = (liste, tilAvd, ut) => liste.forEach(v => {
                const til = mottaker(MEDLEMMER.filter(m => m.avd === tilAvd), v);
                if (til) flytt(v, til, ut);   // ingen plass (alle har nådd målet sitt): væren blir stående
            });
            tildel(beste.n, "Søndre", b.tilSor);
            tildel(beste.so, "Nordre", b.tilNord);
        }
    }

    // B) Fyll opp medlemmer som har færre enn de skal ende med
    const kanAvgi = d => mal(d) === null ? antallEtter(d) > 1 : antallEtter(d) > mal(d);
    for (let runde = 0; runde < 40; runde++) {
        const m = MEDLEMMER.filter(x => underMal(x) > 0).sort((a, c) => underMal(c) - underMal(a))[0];
        if (!m) break;
        const [sN, sS] = flyttStjerner(foer, alleFlytt());
        // 1 hvis flyttingen gjør stjernefordelingen skjevere enn én i forskjell
        const stjerneStraff = v => {
            if (!erStjerne(v.nr) || v.fra.avd === m.avd) return 0;
            const n = m.avd === "Nordre" ? sN + 1 : sN - 1, s = m.avd === "Nordre" ? sS - 1 : sS + 1;
            return Math.abs(n - s) > 1 ? 1 : 0;
        };
        const kilde = vaerer
            .filter(v => ledig(v) && v.fra.id !== m.id && kanAvgi(v.fra))
            .sort((a, c) =>
                (a.fra.avd === m.avd ? 0 : 1) - (c.fra.avd === m.avd ? 0 : 1) ||   // helst samme avdeling
                stjerneStraff(a) - stjerneStraff(c) ||                             // hold stjernene jevnt fordelt
                Number(faa(a)) - Number(faa(c)) ||                                 // helst ikke værer med få parringer
                Number(erFerdig(c.fra, c.nr)) - Number(erFerdig(a.fra, a.nr)) ||   // helst ferdig der den står
                igjenHos(m, c.nr) - igjenHos(m, a.nr) ||                           // mest igjen hos mottakeren
                antallEtter(c.fra) - antallEtter(a.fra))[0];                       // fra den som har flest
        if (!kilde) break;
        flytt(kilde, m, res.ekstra);
    }

    for (const v of vaerer) {
        if (!ledig(v)) continue;
        if (erFerdig(v.fra, v.nr) && restI("Nordre", v.nr) + restI("Søndre", v.nr) === 0) res.ferdigOveralt.push(v);
        else res.utenForslag++;
    }

    res.stjerner = { foer, etter: flyttStjerner(foer, alleFlytt()) };
    MEDLEMMER.forEach(m => { res.har[m.navn] = har[m.id]; res.etter[m.navn] = antallEtter(m); });

    // ---------- Kontroll: ble forutsetningene oppfylt? ----------
    const K = res.kontroll;
    const fylteForinger = foringer.filter(f => f.nr && f.til).length;
    if (fylteForinger - res.utforte > 0) K.push({ ok: res.faste.length === fylteForinger - res.utforte,
        tekst: `Prioriterte ønsker: ${res.faste.length} av ${fylteForinger - res.utforte} tatt med.` });

    MEDLEMMER.forEach(m => {
        const k = medlemKrav[m.navn];
        if (k.gi !== null) {
            const ok = ut[m.id] >= k.gi;
            const hvil = vaerer.filter(v => v.fra.id === m.id && hviler.has(v.nr)).length;
            K.push({ ok, tekst: `${m.navn} sender fra seg ${ut[m.id]} værer (krav: ${k.gi}).` +
                (ok ? "" : hvil ? ` ${hvil} av værene ${m.navn} har, hviler.` : " Fant ingen som kan ta imot flere.") });
        }
        if (k.mal !== null) {
            const n = antallEtter(m), ok = n === k.mal;
            K.push({ ok, tekst: `${m.navn} ender med ${n} værer (ønsket: ${k.mal}).` +
                (ok ? "" : n < k.mal ? " Fant ikke flere værer som kan flyttes hit uten å tømme andre."
                                     : " Noen av værene kan ikke flyttes (hviler eller har et prioritert ønske).") });
        }
    });

    const [stN, stS] = res.stjerner.etter;
    if ((stN === 0 || stS === 0) && STJERNER.length >= 2) K.push({ ok: false,
        tekst: `${stN === 0 ? "Nordre" : "Søndre"} står uten stjernevær etter flyttingene (Nordre ${stN} / Søndre ${stS}). ` +
               "Sjekk de prioriterte ønskene, eller legg inn et ønske som flytter en stjernevær dit." });

    if (medBytte) {
        const sjekk = (fraAvd, tilAvd, onsket, retning) => {
            const n = kryss(fraAvd, tilAvd);
            const auto = byttAntall[tilAvd === "Søndre" ? "tilSor" : "tilNord"] === AUTO;
            let tekst = `${retning}: ${n} foreslått (ønsket: ${onsket}${auto ? ", automatisk" : ""}).`;
            if (n < onsket) {
                const iAvd = vaerer.filter(v => v.fra.avd === fraAvd);
                const deler = [];
                const hvil = iAvd.filter(v => hviler.has(v.nr)).length;
                const andre = iAvd.filter(v => flyttet.has(v.nr) && kryssEn(v) === false).length;
                const ingenRest = iAvd.filter(v => ledig(v) && restI(tilAvd, v.nr) === 0).length;
                if (hvil) deler.push(`${hvil} hviler`);
                if (andre) deler.push(`${andre} flyttes allerede innad`);
                if (ingenRest) deler.push(`${ingenRest} har ingen igjen å pare i ${tilAvd}`);
                const fa = auto ? iAvd.filter(v => ledig(v) && faa(v) && restI(tilAvd, v.nr) > 0).length : 0;
                if (fa) deler.push(`${fa} har ${FAA_PARRINGER} eller færre parringer der de står`);
                tekst += ` ${fraAvd} har ${iAvd.length} værer${deler.length ? ": " + deler.join(", ") : ""}.`;
                const fulle = MEDLEMMER.filter(m => m.avd === tilAvd && !kanTa(m)).map(m => m.navn);
                if (fulle.length) tekst += ` ${fulle.join(" og ")} har nådd «Ende med» og tar ikke imot flere.`;
            } else if (n > onsket) tekst += " Flere enn ønsket på grunn av andre forutsetninger.";
            K.push({ ok: n >= onsket || auto, tekst });   // automatisk retning: kontrollen nedenfor sjekker fordelingen
        };
        // Er væren flyttet mellom avdelingene? (false = flyttet innad)
        const flyttMap = new Map(alleFlytt().map(x => [x.nr, x]));
        const kryssEn = v => { const x = flyttMap.get(v.nr); return x ? x.fra.avd !== x.til.avd : null; };
        sjekk("Nordre", "Søndre", b.onsketSor, "Nordre → Søndre");
        sjekk("Søndre", "Nordre", b.onsketNord, "Søndre → Nordre");
        if (byttAntall.tilSor === AUTO || byttAntall.tilNord === AUTO) {
            const iNord = MEDLEMMER.filter(m => m.avd === "Nordre").reduce((s, m) => s + antallEtter(m), 0);
            K.push({ ok: iNord === b.auto.malNord,
                tekst: `Fordeling etter flyttingene, Nordre / Søndre: ${iNord} / ${b.auto.totalt - iNord} værer ` +
                       `(automatisk mål: ${b.auto.malNord} / ${b.auto.malSor}).` });
        }
    }
    return res;
}

// ---------- Låste forslag (gule huskelapper på Logistikk-siden) ----------
// Felles for alle: lagres som en beskjed i Google-regnearket, pakket kompakt så den holder seg under 200 tegn:
//   «LÅST|F413409:05|S413374:10,413388:21»
//   gruppebokstav + oppføringer «siste 6 sifre i kåringsnr : fra-medlem tilmedlem» (medlemmets plass i MEDLEMMER).
// Manuell avkrysning lagres bare på denne enheten. Avkrysning ut fra «Hos» i appdata.csv vises for alle.
const LAAST_PREFIKS = "LÅST|";
const MAKS_TEGN = 200;   // samme grense som for beskjeder
const LAAST_GRUPPER = [
    ["F", "Prioriterte ønsker", f => f.faste],
    ["G", "Sende fra seg", f => f.maaGi],
    ["S", "Innad i Søndre", f => f.intern["Søndre"]],
    ["N", "Innad i Nordre", f => f.intern["Nordre"]],
    ["s", "Nordre → Søndre", f => f.bytte.tilSor],
    ["n", "Søndre → Nordre", f => f.bytte.tilNord],
    ["M", "For å nå ønsket antall", f => f.ekstra]
];
const erLaast = b => String(b.tekst || "").startsWith(LAAST_PREFIKS);
const erSystemBeskjed = b => erForing(b) || erLaast(b) || erInnst(b);

function pakkLaast(f) {
    const deler = LAAST_GRUPPER.map(([bokstav, , hent]) => {
        const liste = hent(f);
        if (!liste.length) return "";
        return bokstav + liste.map(x => `${x.nr.slice(-6)}:${MEDLEMMER.indexOf(x.fra)}${MEDLEMMER.indexOf(x.til)}`).join(",");
    }).filter(Boolean);
    return deler.length ? LAAST_PREFIKS + deler.join("|") : "";
}

function pakkUtLaast(tekst) {
    const linjer = [];
    String(tekst).split("|").slice(1).forEach(del => {
        const gruppe = (LAAST_GRUPPER.find(g => g[0] === del[0]) || [, "Flytting"])[1];
        del.slice(1).split(",").filter(Boolean).forEach(o => {
            const [kort, ft = ""] = o.split(":");
            const v = vaerData.find(x => String(x["Kåringsnr"]).endsWith(kort));
            const fra = MEDLEMMER[+ft[0]], til = MEDLEMMER[+ft[1]];
            linjer.push({
                gruppe, nr: v ? v["Kåringsnr"] : kort, navn: v ? v["Vær"] : kort,
                fra: fra ? fra.navn : "?", til: til ? til.navn : "?"
            });
        });
    });
    return linjer;
}

// Låste lapper fra regnearket, nyeste først
let laaste = [];
function oppdaterLaaste() {
    laaste = beskjeder.filter(erLaast)
        .map(b => ({ id: b.id, navn: b.navn, tid: b.tid, tekst: b.tekst }))   // pakkes ut når de tegnes, når appdata.csv er lastet
        .sort((a, b) => (new Date(b.tid) - new Date(a.tid)) || 0);
}

let laastGjort = (() => { const g = lesLager("vaerring_laast_gjort", {}); return g && typeof g === "object" ? g : {}; })();

const laasKnapp = () => `<div class="installer" onclick="apneLaasSkjema()">🔒 Lås forslaget som huskelapp for alle</div>`;

function apneLaasSkjema() {
    const tekst = sisteForslag ? pakkLaast(sisteForslag) : "";
    const el = document.getElementById("laasOmraade");
    if (!el) return;
    if (!tekst) { alert("Det er ingen flyttinger å låse akkurat nå."); return; }
    const antall = LAAST_GRUPPER.reduce((s, g) => s + g[2](sisteForslag).length, 0);
    let sist = "";
    try { sist = localStorage.getItem("vaerring_navn") || ""; } catch (e) {}
    el.innerHTML = `
    <div class="skjema" id="lSkjema">

        <div class="skjemafeil" id="lFeil">${tekst.length > MAKS_TEGN
            ? `Forslaget er for stort til å låses (${tekst.length} tegn, maks ${MAKS_TEGN}). Lås det i to omganger, f.eks. med færre værer i byttet.` : ""}</div>
        <div class="rad">
            <div class="liten ok" id="lSend" onclick="sendLaas()">Lås</div>
            <div class="liten" onclick="lukkLaasSkjema()">Avbryt</div>
        </div>
    </div>`;
}
function lukkLaasSkjema() {
    const el = document.getElementById("laasOmraade");
    if (el) el.innerHTML = laasKnapp();
}

let senderLaas = false;
async function sendLaas() {
    if (senderLaas) return;
    const navn = document.getElementById("lNavn").value, kode = document.getElementById("lKode").value;
    const feil = document.getElementById("lFeil"), knapp = document.getElementById("lSend");
    const tekst = sisteForslag ? pakkLaast(sisteForslag) : "";
    if (!tekst) { feil.textContent = "Det er ingen flyttinger å låse."; return; }
    if (tekst.length > MAKS_TEGN) { feil.textContent = `Forslaget er for stort til å låses (${tekst.length} tegn, maks ${MAKS_TEGN}).`; return; }
    if (!navn) { feil.textContent = "Velg navnet ditt."; return; }
    if (kode.length < 4) { feil.textContent = "Skriv inn koden."; return; }

    senderLaas = true; feil.textContent = ""; knapp.textContent = "Låser...";
    const d = await sendBeskjed({ handling: "ny", navn, kode, tekst });
    senderLaas = false;
    if (d.ok) {
        try { localStorage.setItem("vaerring_navn", navn); } catch (e) {}
        lukkLaasSkjema();
        await lastBeskjeder();
        const el = document.getElementById("laaste");
        if (el) el.scrollIntoView({ behavior: "smooth", block: "start" });
    } else {
        feil.textContent = d.feil || "Noe gikk galt.";
        knapp.textContent = "Lås";
    }
}

function vekslGjort(id, nr) {
    const g = laastGjort[id] || [];
    laastGjort[id] = g.includes(nr) ? g.filter(x => x !== nr) : g.concat(nr);
    // Rydd bort avkrysninger for lapper som ikke finnes lenger
    Object.keys(laastGjort).forEach(k => { if (!laaste.some(l => l.id === k)) delete laastGjort[k]; });
    skrivLager("vaerring_laast_gjort", laastGjort);
    tegnLaaste();
}

async function fjernLaast(id) {
    const kode = prompt("Skriv koden for å fjerne denne huskelappen for alle:");
    if (!kode) return;
    const d = await sendBeskjed({ handling: "slett", id, kode });
    if (d.ok) await lastBeskjeder();
    else alert(d.feil || "Kunne ikke fjerne.");
}

// På lappen grupperes flyttingene bare etter hva som skal kjøres: innad i hver avdeling, og mellom avdelingene.
const LOGISTIKK_GRUPPER = ["Innad i Søndre", "Innad i Nordre", "Fraktes mellom sør og nord"];
function logistiskeGrupper(linjer) {
    const avd = navn => (medlemNavn(navn) || {}).avd;
    return linjer.map(x => {
        const fra = avd(x.fra), til = avd(x.til);
        return { ...x, gruppe: fra && fra === til ? `Innad i ${fra}` : LOGISTIKK_GRUPPER[2] };
    }).sort((a, b) => LOGISTIKK_GRUPPER.indexOf(a.gruppe) - LOGISTIKK_GRUPPER.indexOf(b.gruppe));
}

// En linje regnes som gjort når «Hos» i appdata.csv viser at væren er flyttet (synlig for alle),
// eller når den er krysset av for hånd (bare på denne enheten).
function tegnLaaste() {
    const el = document.getElementById("laaste");
    if (!el) return;
    el.innerHTML = laaste.map(lapp => {
        const l = { ...lapp, linjer: logistiskeGrupper(pakkUtLaast(lapp.tekst)) };
        const manuelt = laastGjort[l.id] || [];
        const flyttet = x => (vaerData.find(v => v["Kåringsnr"] === x.nr) || {})["Hos"] === x.til;
        const erGjort = x => flyttet(x) || manuelt.includes(x.nr);
        const antallGjort = l.linjer.filter(erGjort).length;
        let gruppe = "";
        const linjer = l.linjer.map(x => {
            const ny = x.gruppe !== gruppe ? `<li class="gruppe">${esc(x.gruppe)}</li>` : "";
            gruppe = x.gruppe;
            const g = erGjort(x);
            return `${ny}<li class="${g ? "gjort" : ""}" onclick="vekslGjort('${esc(l.id)}', '${esc(x.nr)}')">
                ${g ? "☑" : "☐"} ${stjerne(x.nr)}${esc(x.navn)}: ${esc(x.fra)} → ${esc(x.til)}</li>`;
        }).join("");
        return `
        <div class="lapp">
            <div><b>🔒 Låst forslag</b></div>
            <ul class="huske">${linjer}</ul>
            <div class="fot"><span>Låst av ${esc(l.navn)}, ${esc(lappTid(l.tid))} · ${antallGjort} av ${l.linjer.length} gjort</span>
                <span class="slett" onclick="fjernLaast('${esc(l.id)}')">Fjern</span></div>
        </div>`;
    }).join("");
}

// «Hva skal jeg gjøre?»: det valgte medlemmets egne flyttinger. Bygger på den nyeste låste planen
// (huskelappen) hvis det finnes en, ellers på forslaget slik det er nå.
// Navnet velges hver gang appen åpnes (huskes ikke), siden noen kan kjøre for andre.
let megSelv = "";
function settMegSelv(navn) { megSelv = navn; visLogistikk(); }

function minOversiktHtml(f) {
    const plan = laaste[0];
    const linjer = plan
        ? pakkUtLaast(plan.tekst)
        : [...f.faste, ...f.maaGi, ...f.intern["Søndre"], ...f.intern["Nordre"], ...f.bytte.tilSor, ...f.bytte.tilNord, ...f.ekstra]
            .map(x => ({ nr: x.nr, navn: x.navn, fra: x.fra.navn, til: x.til.navn }));
    const kilde = plan
        ? `Ut fra den låste planen (låst av ${esc(plan.navn)}, ${esc(lappTid(plan.tid))}).`
        : "Ut fra forslaget slik det er nå. Ingen plan er låst ennå.";
    const velg = `<select aria-label="Vis for medlem" onchange="settMegSelv(this.value)">${medlemValgHtml(megSelv, "Velg medlem")}</select>`;
    const m = medlemNavn(megSelv);
    if (!m) return `
    <div class="meg">
        <div class="megtopp"><b>Hva skal jeg gjøre?</b>${velg}</div>
        <p class="notat">Velg hvem du kjører for, så ser du hvilke værer som skal sendes og hentes.</p>
    </div>`;

    const hosNa = nr => (vaerData.find(v => v["Kåringsnr"] === nr) || {})["Hos"];
    const gjort = x => hosNa(x.nr) === x.til;
    const sende = linjer.filter(x => x.fra === m.navn), faa = linjer.filter(x => x.til === m.navn);
    const har = vaerData.filter(v => imp.vaerer[v["Kåringsnr"]] && v["Hos"] === m.navn).length;
    const etter = har - sende.filter(x => !gjort(x)).length + faa.filter(x => !gjort(x)).length;
    const rad = (x, tekst) => `<li class="${gjort(x) ? "gjort" : ""}">${gjort(x) ? "✓ " : ""}${stjerne(x.nr)}<b>${esc(x.navn)}</b> ${tekst}</li>`;

    return `
    <div class="meg">
        <div class="megtopp"><b>Hva skal jeg gjøre?</b>${velg}</div>
        <p class="notat">${kilde}</p>
        <div class="megdel"><span class="megtittel">Sende</span>
            ${sende.length ? `<ul>${sende.map(x => rad(x, `→ ${esc(x.til)}`)).join("")}</ul>` : '<p class="notat">Ingenting å sende.</p>'}</div>
        <div class="megdel"><span class="megtittel">Hente / få</span>
            ${faa.length ? `<ul>${faa.map(x => rad(x, `fra ${esc(x.fra)}`)).join("")}</ul>` : '<p class="notat">Ingenting å få.</p>'}</div>
        <div class="megdel"><span class="megtittel">Værer</span> ${har} → ${etter}</div>
    </div>`;
}

// Forklaringstekster (klassen «forklaring») er skjult som standard. Valget huskes på denne enheten.
let visForklaringer = lesLager("vaerring_forklaringer", false) === true;
function vekslForklaringer() {
    visForklaringer = !visForklaringer;
    skrivLager("vaerring_forklaringer", visForklaringer);
    document.body.classList.toggle("forklaringer", visForklaringer);
    const k = document.getElementById("forklaringKnapp");
    if (k) k.textContent = visForklaringer ? "ⓘ Skjul forklaringer" : "ⓘ Vis forklaringer";
}

function visLogistikk() {
    visning = visLogistikk;
    const status = byttStatus();
    const visBytte = status.trengs || visByttLikevel;
    const f = lagForslag(visBytte);
    sisteForslag = f;

    const kort = fs => fs.map(x => `
        <div class="forslag">
            <div>${x.merke ? `<span class="fastmerke">${esc(x.merke)}</span>` : ""}${stjerne(x.nr)}<b style="cursor:pointer" onclick="visVaer('${esc(x.nr)}', 'logistikk')">${esc(x.navn)}</b>${obsMerkeNr(x.nr)}</div>
            <div class="rute">${esc(x.fra.navn)} <span class="pil">→</span> ${esc(x.til.navn)}
                ${x.fra.avd !== x.til.avd ? `<small style="display:inline">(${x.fra.avd} → ${x.til.avd})</small>` : ""}</div>
            <small class="forklaring">${erFerdig(x.fra, x.nr) ? "Ferdig hos" : "Står hos"} ${esc(x.fra.navn)} (${utfort(x.fra, x.nr)} / ${kvote(x.fra)}) –
                ${esc(x.til.navn)} har ${igjenHos(x.til, x.nr)} igjen på denne (${utfort(x.til, x.nr)} / ${kvote(x.til)})
                og ${behov(x.til)} søyer igjen å pare.</small>
        </div>`).join("");

    const seksjon = (tittel, fs) => `
        <h3 class="avsnitt">${tittel}</h3>
        ${fs.length ? kort(fs) : '<p class="notat">Ingen forslag akkurat nå.</p>'}`;

    const st = f.stjerner;
    // Alle flyttinger samles etter hva som skal kjøres, uansett hvorfor de foreslås
    // (prioritert ønske, «sende fra seg», ferdig vær, bytte eller ønsket antall).
    const alle = [...f.faste, ...f.maaGi, ...f.intern["Søndre"], ...f.intern["Nordre"],
                  ...f.bytte.tilSor, ...f.bytte.tilNord, ...f.ekstra];
    const innad = avd => alle.filter(x => x.fra.avd === avd && x.til.avd === avd);
    const mellom = (fra, til) => alle.filter(x => x.fra.avd === fra && x.til.avd === til);
    const tilSor = mellom("Nordre", "Søndre"), tilNord = mellom("Søndre", "Nordre");
    const harMellom = tilSor.length + tilNord.length > 0;

    const byttedel = `
        ${harMellom ? `
        ${tilSor.length ? `<h4>Fra Nordre til Søndre</h4>${kort(tilSor)}` : ""}
        ${tilNord.length ? `<h4>Fra Søndre til Nordre</h4>${kort(tilNord)}` : ""}`
        : `<p class="notat">${visBytte ? "Ingen værer skal fraktes mellom avdelingene med disse forutsetningene." : "Ikke nødvendig ennå."}</p>`}
        ${visBytte
            ? (status.trengs ? "" : '<div class="liten" onclick="settByttLikevel(false)">Skjul forslag til bytte</div>')
            : '<div class="liten" onclick="settByttLikevel(true)">Vis forslag til bytte likevel</div>'}`;

    document.getElementById("app").innerHTML = `
    <div class="tilbake" onclick="visForside()">← Tilbake</div>
    ${advarsler.map(a => `<div class="feil">${esc(a)}</div>`).join("")}
    <div class="tittelrad"><h2>Logistikk</h2>
        <span class="forklaringknapp" id="forklaringKnapp" onclick="vekslForklaringer()">${visForklaringer ? "ⓘ Skjul forklaringer" : "ⓘ Vis forklaringer"}</span></div>
    ${minOversiktHtml(f)}
    <div class="tips">
        <b>Har du et bestemt ønske til neste flytting?</b>
        Legg det inn som et prioritert ønske (fast føring) under «Forutsetninger». Alle kan se det, og det går foran
        de automatiske forslagene.
        <a href="#foringer" onclick="document.getElementById('foringer').scrollIntoView({behavior:'smooth'});return false">Legg inn et prioritert ønske ↓</a>
    </div>
    <p class="notat forklaring">Rekkefølge for automatisk beregning: 1. evt. prioriterte ønsker (faste føringer), 2. evt. endringer i antall per medlem,
        3. flytting innad i avdelingene, 4. bytte mellom avdelingene, og til slutt 5. flytting så alle ender med ønsket antall.
        De som har flest søyer igjen å pare får flest værer. Værer med ${FAA_PARRINGER} eller færre parringer der de står,
        foreslås bare flyttet når det trengs av andre grunner. Stjerneværene (<span class="stjerne">★</span>) fordeles
        så jevnt som mulig, slik at det er minst én i hver avdeling. Værer med 💤 Hvile foreslås ikke flyttet.
        De automatiske forslagene bygger på hvem som står som «Hos» i appdata.csv.</p>
    ${forutsetningerHtml(f)}
    ${f.foringsfeil.map(a => `<div class="feil">${esc(a)}</div>`).join("")}
    ${kontrollHtml(f)}
    ${seksjon("Innad i Søndre", innad("Søndre"))}
    ${seksjon("Innad i Nordre", innad("Nordre"))}

    <h3 class="avsnitt">Fraktes mellom sør og nord${harMellom ? ` (${tilSor.length} sørover, ${tilNord.length} nordover)` : ""}</h3>
    <p class="notat forklaring">Bytte trengs når minst ${BYTTE_VAERER} værer er ferdige hos minst ${BYTTE_MEDLEMMER} av ${MEDLEMMER.length} medlemmer.
        Nå: ${status.ferdige} av ${status.totalt} værer.
        <span class="stjerne">★</span> Stjerneværer, Nordre / Søndre: nå ${st.foer[0]} / ${st.foer[1]},
        etter flyttingene ${st.etter[0]} / ${st.etter[1]}.</p>
    ${byttedel}

    <p class="notat" style="margin-top:20px">
        ${f.utenForslag} værer blir stående der de er.
        ${f.hviler.length ? `Hviler og flyttes ikke: ${f.hviler.map(v => stjerne(v.nr) + esc(v.navn)).join(", ")}.
            Legg inn et prioritert ønske hvis en av dem likevel skal flyttes.` : ""}
        ${f.ferdigOveralt.length ? `Ferdige hos alle: ${f.ferdigOveralt.map(v => stjerne(v.nr) + esc(v.navn)).join(", ")}.` : ""}
    </p>
    <div id="laasOmraade">${harBeskjeder() ? laasKnapp() : ""}</div>
    <div class="lapper" id="laaste"></div>`;
    document.body.classList.toggle("forklaringer", visForklaringer);
    tegnLaaste();
}

// ---------- Oppstart ----------
function hent(fil) {
    // no-store: sikrer at ny import.csv vises med en gang, ikke en hurtiglagret versjon
    return fetch(fil, { cache: "no-store" }).then(r => {
        if (!r.ok) throw new Error(`${fil}: HTTP ${r.status}`);
        return r.text().then(text => ({
            text,
            modified: r.headers.get("Last-Modified"),
            fraCache: r.headers.get("X-Fra-Cache") === "1"   // satt av sw.js når nettet er borte
        }));
    });
}

let sisteLast = 0, pagaar = null;

// Har det kommet en nyere versjon av selve siden (index.html)? Da lastes den på nytt.
// Hindrer at noen blir sittende med en gammel utgave etter at du har lastet opp en ny.
// Maks én automatisk lasting per to minutter, så den aldri kan gå i løkke.
function sjekkNyVersjon() {
    if (navigator.onLine === false) return;
    fetch(location.pathname, { method: "HEAD", cache: "no-cache" }).then(r => {
        const ny = new Date(r.headers.get("Last-Modified")), denne = new Date(document.lastModified);
        if (!r.ok || isNaN(ny) || isNaN(denne) || ny <= denne) return;
        let sist = 0;
        try { sist = +sessionStorage.getItem("vaerring_reload") || 0; } catch (e) {}
        if (Date.now() - sist < 120000) return;
        try { sessionStorage.setItem("vaerring_reload", String(Date.now())); } catch (e) {}
        location.reload();
    }).catch(() => {});
}

// Henter data på nytt og tegner den siden brukeren står på
function last() {
    sjekkNyVersjon();
    lastBeskjeder();
    if (pagaar) return pagaar;
    pagaar = Promise.allSettled([hent("appdata.csv"), hent("import.csv")]).then(([a, i]) => {
    advarsler = [];
    if (a.status === "fulfilled") {
        vaerData = tilObjekter(parseCSV(a.value.text));
        advarsler.push(...klargjorVaerData(vaerData));
    } else advarsler.push("Kunne ikke lese appdata.csv.");

    if (i.status === "fulfilled") {
        imp = tolkImport(parseCSV(i.value.text));

        // «Sist oppdatert» hentes fra tidspunktet import.csv sist ble endret på serveren
        let sistTekst = "";
        const d = new Date(i.value.modified);
        if (i.value.modified && !isNaN(d)) {
            sistTekst = "Sist oppdatert: " +
                d.toLocaleString("nb-NO", {
                    day: "numeric", month: "long", year: "numeric",
                    hour: "2-digit", minute: "2-digit", timeZone: "Europe/Oslo"
                });
        }
        if (i.value.fraCache || (a.status === "fulfilled" && a.value.fraCache)) {
            sistTekst += (sistTekst ? " – " : "") + "uten nett, viser sist lagrede tall";
        }
        document.getElementById("sist").textContent = sistTekst;

        if (!imp) advarsler.push("Fant ikke produsentene i import.csv. Er filen riktig eksportert?");
        else if (a.status === "fulfilled") advarsler.push(...sjekkMotImport());
    } else advarsler.push("Kunne ikke lese import.csv.");

    if (!skjemaApen()) {   // ikke ta bort et halvskrevet skjema
        const y = window.scrollY;
        (visning || visForside)();
        window.scrollTo(0, y);
    }
    }).finally(() => { pagaar = null; sisteLast = Date.now(); });
    return pagaar;
}

// ---------- Kodesperre ----------
// Enkel sperre mot nysgjerrige. Koden ligger i filen, så dette er ikke ekte sikkerhet.
const KODE = "1982";
const LAGRINGSNOKKEL = "vaerring_kode_ok";

function lagret() { try { return localStorage.getItem(LAGRINGSNOKKEL) === KODE; } catch (e) { return false; } }
function husk() { try { localStorage.setItem(LAGRINGSNOKKEL, KODE); } catch (e) {} }

(function () {
    const port = document.getElementById("port");
    const felt = document.getElementById("kode");
    const feil = document.getElementById("kodefeil");
    if (lagret()) return;

    port.style.display = "flex";
    felt.focus();
    felt.addEventListener("input", () => {
        felt.value = felt.value.replace(/\D/g, "");
        feil.textContent = "";
        if (felt.value.length < 4) return;
        if (felt.value === KODE) {
            husk();
            port.style.display = "none";
        } else {
            feil.textContent = "Feil kode";
            felt.value = "";
        }
    });
})();

last();

// Gjør at appen kan åpnes uten nett (viser sist lagrede tall) og kan installeres direkte på Android.
if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
}

// Automatisk oppdatering når appen åpnes igjen etter mer enn ett minutt borte
document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "visible" && Date.now() - sisteLast > 60000) last();
});

// Dra ned for å oppdatere (fungerer likt på iPhone og Android)
(function () {
    const GRENSE = 70;
    const ind = document.getElementById("pull");
    let y0 = null, dy = 0, oppdaterer = false;

    const paToppen = () => (window.scrollY || document.documentElement.scrollTop || 0) <= 0;
    const skjul = () => { ind.style.opacity = 0; ind.style.transform = "translateY(-34px)"; };

    document.addEventListener("touchstart", e => {
        y0 = !oppdaterer && paToppen() ? e.touches[0].clientY : null;
        dy = 0;
    }, { passive: true });

    document.addEventListener("touchmove", e => {
        if (y0 === null) return;
        dy = e.touches[0].clientY - y0;
        if (dy > 10) {
            ind.textContent = dy > GRENSE ? "Slipp for å oppdatere" : "Dra for å oppdatere";
            ind.style.opacity = Math.min(dy / GRENSE, 1);
            ind.style.transform = `translateY(${Math.min(dy / 2, 50) - 34}px)`;
        } else skjul();
    }, { passive: true });

    document.addEventListener("touchend", () => {
        const utlost = y0 !== null && dy > GRENSE;
        y0 = null; dy = 0;
        if (!utlost) { skjul(); return; }

        oppdaterer = true;
        ind.textContent = "Oppdaterer...";
        ind.style.opacity = 1;
        ind.style.transform = "translateY(0)";
        last().finally(() => { oppdaterer = false; skjul(); });
    });
})();
</script>
